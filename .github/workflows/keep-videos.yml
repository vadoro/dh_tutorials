# 튜토리얼 영상(MP4)을 저장소 주인만 볼 수 있는 비공개 릴리스(초안 'videos')에 보관합니다.
# 사이트는 MP4를 내려받게 하지 않습니다. 방문자는 인터랙티브 페이지로 봐요(CLAUDE.md의 '영상' 참고).
# 보관한 영상은 GitHub에 로그인한 저장소 주인만 Releases 화면에서 내려받을 수 있어요.
#
# 새 영상을 보관하는 법 (선택)
#   1. 렌더링한 MP4를 임시 브랜치에 커밋해 올립니다(.gitignore에 있어 -f가 필요해요).
#        git switch -c upload-video
#        git add -f <slug>/video/<slug>.mp4 && git commit -m "영상 보관: <slug>"
#        git push -u origin upload-video
#   2. Actions 탭 → '영상 보관' → Run workflow → 브랜치 upload-video 를 골라 실행합니다.
#      같은 이름의 파일이 있으면 바꿔 넣어요.
#   3. 다 올라가면 임시 브랜치를 지웁니다: git switch main && git push origin --delete upload-video
#
# MP4가 없는 브랜치(main)에서 실행하면 릴리스를 비공개(초안)로 되돌리고 공개 태그를 지우기만 합니다.
name: 영상 보관

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 비공개 videos 릴리스에 MP4 보관
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(*/video/*.mp4)
          if ! gh release view videos >/dev/null 2>&1; then
            gh release create videos --draft --title "튜토리얼 영상 (비공개 보관)" --notes "저장소 주인만 보는 보관용 MP4입니다. 사이트에서는 인터랙티브 페이지로만 보여 줍니다."
          fi
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload videos "${files[@]}" --clobber
          fi
          gh release edit videos --draft=true --title "튜토리얼 영상 (비공개 보관)" --notes "저장소 주인만 보는 보관용 MP4입니다. 사이트에서는 인터랙티브 페이지로만 보여 줍니다."
          # 공개 태그가 있으면 지움 (태그의 소스 코드 압축 파일에 예전 MP4가 들어 있음)
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/videos" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/videos"
            echo "공개 태그 videos를 지웠습니다."
          fi
          gh release view videos --json isDraft,assets --jq '"초안(비공개): \(.isDraft)", (.assets[] | "\(.name)\t\(.size)")'
