# 튜토리얼 영상(MP4)을 GitHub Releases의 'videos' 릴리스에 올립니다.
# MP4는 저장소에 두지 않고 여기에만 둡니다(CLAUDE.md의 '영상' 참고).
#
# 새 영상을 올리거나 바꾸는 법
#   1. 렌더링한 MP4를 임시 브랜치에 커밋해 올립니다(.gitignore에 있어 -f가 필요해요).
#        git switch -c upload-video
#        git add -f <slug>/video/<slug>.mp4 && git commit -m "영상 올리기: <slug>"
#        git push -u origin upload-video
#   2. Actions 탭 → '영상 올리기' → Run workflow → 브랜치 upload-video 를 골라 실행합니다.
#      같은 이름의 파일이 있으면 바꿔 넣으므로 주소는 그대로예요.
#   3. 다 올라가면 임시 브랜치를 지웁니다: git switch main && git push origin --delete upload-video
#
# 주소: https://github.com/vadoro/dh_tutorials/releases/download/videos/<파일 이름>.mp4
name: 영상 올리기

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: videos 릴리스에 MP4 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(*/video/*.mp4)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::이 브랜치에 올릴 MP4(<slug>/video/*.mp4)가 없습니다."
            exit 1
          fi
          if ! gh release view videos >/dev/null 2>&1; then
            gh release create videos --target main --title "튜토리얼 영상" --notes "DH 튜토리얼의 수업용 MP4 영상입니다. 1080p, 자막이 화면에 들어 있고 장(chapter)이 표시돼 있어요.

          인터랙티브 페이지: https://vadoro.github.io/dh_tutorials/
          자막 원고(.srt)는 각 튜토리얼의 video/ 폴더에 있어요. 영상은 Actions의 '영상 올리기'로 올리고 바꿉니다."
          fi
          gh release upload videos "${files[@]}" --clobber
          gh release view videos --json assets --jq '.assets[] | "\(.name)\t\(.size)"'
